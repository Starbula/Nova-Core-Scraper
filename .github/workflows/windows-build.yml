name: Windows executable

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt -r requirements-dev.txt
      - name: Run fixture tests
        run: python -m pytest -q
      - name: Smoke-test desktop window
        timeout-minutes: 1
        shell: pwsh
        run: |
          $process = Start-Process -FilePath (Get-Command python).Source -ArgumentList 'main.py', '--smoke-test-ui' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Desktop smoke test failed: $($process.ExitCode)" }
      - name: Build portable executable
        run: python build.py
      - name: Smoke-test packaged executable
        timeout-minutes: 2
        shell: pwsh
        run: |
          $resultPath = Join-Path $PWD 'self-test-result.json'
          $process = Start-Process -FilePath '.\dist\NovaCore-Artwork-Scraper.exe' -ArgumentList '--self-test', 'self-test-result.json' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Packaged self-test failed: $($process.ExitCode)" }
          if (-not (Test-Path $resultPath)) { throw 'Packaged self-test did not write its result file.' }
          $result = Get-Content -LiteralPath $resultPath -Raw | ConvertFrom-Json
          if ($result.success -ne $true) { throw "Packaged self-test reported failure: $(Get-Content -LiteralPath $resultPath -Raw)" }
      - name: Smoke-test packaged desktop window
        timeout-minutes: 2
        shell: pwsh
        run: |
          $process = Start-Process -FilePath '.\dist\NovaCore-Artwork-Scraper.exe' -ArgumentList '--smoke-test-ui' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Packaged desktop smoke test failed: $($process.ExitCode)" }
      - name: Package download
        shell: pwsh
        run: |
          $packagePath = 'dist/NovaCore-Artwork-Scraper-Windows'
          New-Item -ItemType Directory -Path "$packagePath/docs" -Force | Out-Null
          Copy-Item -Path 'dist/NovaCore-Artwork-Scraper.exe', 'LICENSE', 'README.md' -Destination $packagePath
          Copy-Item -Path 'docs/providers.md' -Destination "$packagePath/docs"
          Compress-Archive -Path "$packagePath/*" -DestinationPath 'dist/NovaCore-Artwork-Scraper-Windows.zip'
      - name: Upload portable app
        uses: actions/upload-artifact@v4
        with:
          name: NovaCore-Artwork-Scraper-Windows
          path: dist/NovaCore-Artwork-Scraper-Windows.zip
          if-no-files-found: error
      - name: Upload smoke-test result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: self-test-result
          path: self-test-result.json
          if-no-files-found: ignore
